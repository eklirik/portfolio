<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EKLIRIK — видео, 3D, брендинг, игры</title>
<meta name="description" content="Портфолио студии EKLIRIK: видео для застройщиков и отелей, 3D-персонажи, фирменные стили и логотипы, игры для Roblox и музыка.">
<meta property="og:title" content="EKLIRIK — 3D, branding, games">
<meta property="og:description" content="3D characters, brand identities and Roblox games.">
<meta property="og:image" content="media/og.jpg">
<meta name="theme-color" content="#0f0f11">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="top" id="top">
  <a class="brand" href="#hero" aria-label="EKLIRIK">
    <span class="brand__mark">e</span><span class="brand__name">EKLIRIK</span>
  </a>
  <nav class="nav" aria-label="Main">
    <a href="#video" data-i18n="nav_video"></a>
    <a href="#models" data-i18n="nav_3d"></a>
    <a href="#branding" data-i18n="nav_brand"></a>
    <a href="#games" data-i18n="nav_games"></a>
    <a href="#music" data-i18n="nav_music"></a>
    <a href="#contact" data-i18n="nav_contact"></a>
  </nav>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="ru">RU</button>
    <button type="button" data-lang="en">EN</button>
  </div>
</header>

<main>
  <section class="hero" id="hero">
    <div class="hero__glow" aria-hidden="true"></div>
    <div class="wrap hero__inner">
      <p class="kicker" data-i18n="hero_kicker"></p>
      <h1 class="hero__title" data-i18n-html="hero_title"></h1>
      <p class="hero__text" data-i18n="hero_text"></p>
      <div class="hero__cta">
        <a class="btn btn--accent" href="#video" data-i18n="hero_cta1"></a>
        <a class="btn btn--ghost" href="#contact" data-i18n="hero_cta2"></a>
      </div>
    </div>
    <div class="wrap hero__reels">
      <p class="hero__reels-cap" data-i18n="hero_reels"></p>
      <div class="hreels" id="heroReels"></div>
    </div>
    <div class="marquee" aria-hidden="true"><div class="marquee__track" id="marquee"></div></div>
    <div class="wrap stats">
      <div class="stat"><b>35+</b><span data-i18n="s1"></span></div>
      <div class="stat"><b>14</b><span data-i18n="s2"></span></div>
      <div class="stat"><b>4</b><span data-i18n="s3"></span></div>
      <div class="stat"><b>3</b><span data-i18n="s4"></span></div>
    </div>
  </section>

  <section class="services wrap" aria-labelledby="srv-t">
    <h2 class="services__title" id="srv-t" data-i18n="srv_t"></h2>
    <div class="services__grid">
      <a class="srv" href="#video"><i>01</i><h3 data-i18n="srv4_t"></h3><p data-i18n="srv4_d"></p></a>
      <a class="srv" href="#models"><i>02</i><h3 data-i18n="srv1_t"></h3><p data-i18n="srv1_d"></p></a>
      <a class="srv" href="#branding"><i>03</i><h3 data-i18n="srv2_t"></h3><p data-i18n="srv2_d"></p></a>
      <a class="srv" href="#games"><i>04</i><h3 data-i18n="srv3_t"></h3><p data-i18n="srv3_d"></p></a>
      <a class="srv" href="#music"><i>05</i><h3 data-i18n="srv6_t"></h3><p data-i18n="srv6_d"></p></a>
    </div>
  </section>

  <section class="section" id="video">
    <div class="wrap">
      <div class="head">
        <p class="kicker" data-i18n="secvid_k"></p>
        <h2 data-i18n="secvid_t"></h2>
        <p class="head__text" data-i18n="secvid_d"></p>
      </div>
      <div class="reels" id="reels"></div>
    </div>
  </section>

  <section class="section" id="models">
    <div class="wrap">
      <div class="head">
        <p class="kicker" data-i18n="sec3d_k"></p>
        <h2 data-i18n="sec3d_t"></h2>
        <p class="head__text" data-i18n="sec3d_d"></p>
      </div>
      <div class="grid3d" id="grid3d"></div>
    </div>
  </section>

  <section class="section section--paper" id="branding">
    <div class="wrap">
      <div class="head">
        <p class="kicker" data-i18n="secbrand_k"></p>
        <h2 data-i18n="secbrand_t"></h2>
        <p class="head__text" data-i18n="secbrand_d"></p>
      </div>
      <div class="brands" id="brands"></div>
    </div>
  </section>

  <section class="section section--dark" id="games">
    <div class="wrap">
      <div class="head">
        <p class="kicker" data-i18n="secgames_k"></p>
        <h2 data-i18n="secgames_t"></h2>
        <p class="head__text" data-i18n="secgames_d"></p>
      </div>
      <div class="games" id="gamesList"></div>
    </div>
  </section>

  <section class="section section--paper" id="music">
    <div class="wrap">
      <div class="head">
        <p class="kicker" data-i18n="secmusic_k"></p>
        <h2 data-i18n="secmusic_t"></h2>
        <p class="head__text" data-i18n="secmusic_d"></p>
      </div>
      <div class="channels" id="channels"></div>
    </div>
  </section>

  <section class="contact" id="contact">
    <div class="wrap contact__inner">
      <h2 data-i18n-html="contact_t"></h2>
      <div>
        <p data-i18n="contact_d"></p>
        <div class="contact__btns" id="contactBtns"></div>
      </div>
    </div>
  </section>
</main>

<footer class="foot wrap">
  <span>© 2026 EKLIRIK</span>
  <span data-i18n="footer"></span>
  <a href="https://t.me/ekLirik19" target="_blank" rel="noopener">Telegram: @ekLirik19</a>
</footer>

<!-- Окно просмотра работы -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" hidden>
  <div class="modal__box">
    <div class="viewer">
      <div class="stage" id="stage"><div class="stage__inner" id="stageInner"></div></div>
      <button class="vbtn vbtn--prev" id="shotPrev" type="button" aria-label="‹">‹</button>
      <button class="vbtn vbtn--next" id="shotNext" type="button" aria-label="›">›</button>
      <div class="tools">
        <button type="button" id="zOut" data-i18n-title="m_zoom_out">−</button>
        <button type="button" id="zFit" data-i18n-title="m_fit">⤢</button>
        <button type="button" id="zIn" data-i18n-title="m_zoom_in">+</button>
        <button type="button" id="zFull" data-i18n-title="m_full">⛶</button>
      </div>
      <p class="hint" id="hint"></p>
      <div class="thumbs" id="thumbs"></div>
    </div>
    <aside class="info" id="info"></aside>
    <button class="close" id="mClose" type="button" data-i18n-title="m_close" aria-label="Close">×</button>
  </div>
</div>

<script src="assets/media.js"></script>
<script src="assets/content.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
